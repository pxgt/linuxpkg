name: Pages

# Publishes https://pxgt.github.io/linuxpkg/ : the static page with the in-browser tools (web/ compiled
# to JavaScript) and signed package repositories (apt, dnf, pacman, apk) with linuxpkg itself and
# moonthrift, all built here by linuxpkg. Build outputs are never committed; the signing key comes
# from the LINUXPKG_SIGNING_KEY secret and is only written to a temporary file.
# The packaged programs are statically linked with glibc: each package installs its
# THIRD_PARTY_NOTICES, and the source of that glibc is published under /sources/. The page itself
# links THIRD_PARTY_NOTICES.txt for the JavaScript build.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  packages:
    name: packages (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, arch: x86_64, deb: amd64 }
          - { os: ubuntu-22.04-arm, arch: aarch64, deb: arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Build the static linuxpkg, its notices and the glibc source
        run: |
          moon update
          printf '\noptions(\n  link: { "native": { "cc-link-flags": "-static" } },\n)\n' >> cmd/main/moon.pkg
          moon build --target native --release cmd/main
          mkdir -p stage out sources
          cp _build/native/release/build/cmd/main/main.exe stage/linuxpkg
          chmod +x stage/linuxpkg
          stage/linuxpkg --version
          VERSION="$(stage/linuxpkg --version | awk '{print $2}')"
          tools/notices/prepare_dist.sh linuxpkg "$VERSION" . "$GITHUB_SHA" sources stage/THIRD_PARTY_NOTICES \
            "https://pxgt.github.io/linuxpkg/sources/"

      - name: Package linuxpkg with linuxpkg, signed
        env:
          SIGN_KEY: ${{ secrets.LINUXPKG_SIGNING_KEY }}
        run: |
          [ -n "$SIGN_KEY" ] || { echo "::error::LINUXPKG_SIGNING_KEY is not available"; exit 1; }
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          keyfile="$RUNNER_TEMP/signing.key"
          umask 077
          printf '%s\n' "$SIGN_KEY" > "$keyfile"
          python3 - "$PWD" "${{ matrix.deb }}" <<'PY'
          import json, sys
          root, arch = sys.argv[1:3]
          config = json.load(open(root + "/examples/self/linuxpkg.json"))
          config["arch"] = arch
          for item in config["contents"]:
              if item["dst"] == "/usr/bin/linuxpkg":
                  item["src"] = root + "/stage/linuxpkg"
              else:
                  item["src"] = root + "/" + item["src"].replace("../../", "")
          config["contents"].append({"src": root + "/stage/THIRD_PARTY_NOTICES", "dst": "/usr/share/doc/linuxpkg/THIRD_PARTY_NOTICES"})
          json.dump(config, open(root + "/self.json", "w"), indent=2)
          PY
          stage/linuxpkg build self.json --out out --sign-key "$keyfile" --apk-key-name linuxpkg.rsa.pub
          rm -f "$keyfile"
          ls -l out

      - name: Package moonthrift (latest release) with linuxpkg init --moon
        continue-on-error: true
        env:
          SIGN_KEY: ${{ secrets.LINUXPKG_SIGNING_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(gh api repos/pxgt/moonthrift/releases/latest --jq .tag_name)"
          echo "moonthrift $tag"
          git clone --quiet --depth 1 --branch "$tag" https://github.com/pxgt/moonthrift moonthrift-src
          cd moonthrift-src
          printf '\noptions(\n  link: { "native": { "cc-link-flags": "-static" } },\n)\n' >> cmd/main/moon.pkg
          moon update
          moon build --target native --release
          ../stage/linuxpkg init --moon . --arch "${{ matrix.deb }}"
          sed -i 's|"maintainer": ".*"|"maintainer": "pxgt <133531533+pxgt@users.noreply.github.com>"|' linuxpkg.json
          version="$(python3 -c 'import json; print(json.load(open("linuxpkg.json"))["version"])')"
          ../tools/notices/prepare_dist.sh moonthrift "$version" . "$tag" ../sources THIRD_PARTY_NOTICES \
            "https://pxgt.github.io/linuxpkg/sources/"
          python3 - <<'PY'
          import json
          config = json.load(open("linuxpkg.json"))
          config["contents"].append({"src": "THIRD_PARTY_NOTICES", "dst": "/usr/share/doc/moonthrift/THIRD_PARTY_NOTICES"})
          json.dump(config, open("linuxpkg.json", "w"), indent=2)
          PY
          keyfile="$RUNNER_TEMP/signing2.key"
          umask 077
          printf '%s\n' "$SIGN_KEY" > "$keyfile"
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          ../stage/linuxpkg build linuxpkg.json --out ../out --sign-key "$keyfile" --apk-key-name linuxpkg.rsa.pub
          rm -f "$keyfile"
          ls -l ../out

      - name: Every package carries its notices
        run: python3 tools/notices/check_dist.py stage/linuxpkg out sources

      - name: Keep the packages
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.arch }}
          path: |
            out/*
            sources/*
            stage/linuxpkg

  site:
    name: assemble the site
    needs: packages
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Build the browser library and its notices
        run: |
          moon update
          moon build --target js --release web
          mkdir -p public
          cp site/index.html site/style.css site/app.js site/linuxpkg.asc site/linuxpkg.rsa.pub public/
          VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' moon.mod)"
          python3 tools/notices/make_notices.py --project linuxpkg --version "$VERSION" --module-root . --kind js -o public/THIRD_PARTY_NOTICES.txt
          { printf '/*! linuxpkg %s, Apache-2.0. Third-party notices: THIRD_PARTY_NOTICES.txt */\n' "$VERSION"; cat _build/js/release/build/web/web.js; } > public/linuxpkg-web.js

      - name: Download the packages
        uses: actions/download-artifact@v5
        with:
          pattern: packages-*
          path: downloaded

      - name: Build the signed repositories
        env:
          SIGN_KEY: ${{ secrets.LINUXPKG_SIGNING_KEY }}
        run: |
          mkdir -p pkgs/x86_64 pkgs/aarch64
          cp downloaded/packages-x86_64/out/* pkgs/x86_64/
          cp downloaded/packages-aarch64/out/* pkgs/aarch64/
          chmod +x downloaded/packages-x86_64/stage/linuxpkg
          keyfile="$RUNNER_TEMP/signing.key"
          umask 077
          printf '%s\n' "$SIGN_KEY" > "$keyfile"
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          tools/assemble_site.sh "$PWD/downloaded/packages-x86_64/stage/linuxpkg" "$PWD/pkgs" "$PWD/public" "$keyfile"
          rm -f "$keyfile"

      - name: Publish the glibc source next to the packages
        run: |
          mkdir -p public/sources
          cp downloaded/packages-*/sources/* public/sources/
          {
            echo '<!doctype html><meta charset="utf-8"><title>linuxpkg: corresponding source</title>'
            echo '<p>The programs in these package repositories are statically linked with the GNU C Library'
            echo '(LGPL-2.1-or-later). This is the Ubuntu source package of the exact version linked in. See'
            echo 'THIRD_PARTY_NOTICES in each package, and <a href="../THIRD_PARTY_NOTICES.txt">the notices of this page</a>.</p><ul>'
            for f in public/sources/glibc_*; do n="$(basename "$f")"; echo "<li><a href=\"$n\">$n</a></li>"; done
            echo '</ul>'
          } > public/sources/index.html
          ls -l public/sources

      - name: Upload the site
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  install:
    name: install from https in ${{ matrix.image }}
    needs: deploy
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: "debian:12", family: deb }
          - { image: "ubuntu:24.04", family: deb }
          - { image: "fedora:41", family: rpm }
          - { image: "openeuler/openeuler:24.03-lts", family: rpm }
          - { image: "archlinux:latest", family: arch }
          - { image: "alpine:3.20", family: apk }
    steps:
      - name: Check out source (for the example)
        uses: actions/checkout@v5

      - name: Add the repository, install, run
        run: |
          docker run --rm -v "$PWD/examples/hello:/hello:ro" "${{ matrix.image }}" sh -ec '
            BASE=https://pxgt.github.io/linuxpkg
            case "${{ matrix.family }}" in
              deb)
                apt-get update -qq && apt-get install -y -qq curl ca-certificates >/dev/null
                mkdir -p /etc/apt/keyrings
                curl -fsSL "$BASE/linuxpkg.asc" -o /etc/apt/keyrings/linuxpkg.asc
                echo "deb [signed-by=/etc/apt/keyrings/linuxpkg.asc] $BASE/apt ./" > /etc/apt/sources.list.d/linuxpkg.list
                apt-get update
                apt-get install -y linuxpkg
                ;;
              rpm)
                curl -fsSL "$BASE/rpm/linuxpkg.repo" -o /etc/yum.repos.d/linuxpkg.repo
                dnf --disablerepo="*" --enablerepo=linuxpkg install -y linuxpkg
                ;;
              arch)
                curl -fsSL "$BASE/linuxpkg.asc" -o /tmp/linuxpkg.asc
                pacman-key --init
                pacman-key --add /tmp/linuxpkg.asc
                pacman-key --lsign-key D6298A33CA44D77415DC1187ECDA980444350858
                printf "\n[linuxpkg]\nSigLevel = Required DatabaseRequired\nServer = $BASE/arch/\$arch\n" >> /etc/pacman.conf
                pacman -Sy --noconfirm linuxpkg
                ;;
              apk)
                apk add --no-cache curl >/dev/null
                curl -fsSL "$BASE/linuxpkg.rsa.pub" -o /etc/apk/keys/linuxpkg.rsa.pub
                echo "$BASE/alpine" >> /etc/apk/repositories
                apk add linuxpkg
                ;;
            esac
            linuxpkg --version
            mkdir -p /tmp/out
            cd /hello && linuxpkg build linuxpkg.json --out /tmp/out
            linuxpkg verify /tmp/out/hello_1.0.0-1_all.deb
          '
