name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: verify (all backends)
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Record toolchain
        run: moon version --all

      - name: Update package registry
        run: moon update

      - name: Check formatting
        run: moon fmt --check

      - name: Generate and verify public interfaces
        run: |
          moon info --target all
          git diff --exit-code

      - name: Check every backend without warnings
        run: moon check --target all --deny-warn

      - name: Build every backend
        run: moon build --target all

      - name: Test every backend
        run: moon test --target all

      - name: CLI packages are byte-identical on native, wasm, wasm-gc and js
        run: |
          for c in gzip xz zstd none; do
            for t in native wasm wasm-gc js; do
              moon run cmd/main --target "$t" -- build examples/hello/linuxpkg.json --compression "$c" --out "/tmp/cli-$t-$c"
            done
            case "$c" in xz) ext=.xz ;; zstd) ext=.zst ;; gzip) ext=.gz ;; none) ext= ;; esac
            for t in wasm wasm-gc js; do
              for f in hello_1.0.0-1_all.deb hello-1.0.0-1.noarch.rpm "hello-1.0.0-1-any.pkg.tar$ext" hello-1.0.0-r1.apk; do
                cmp "/tmp/cli-native-$c/$f" "/tmp/cli-$t-$c/$f"
              done
            done
          done

      - name: Browser build gives the same packages and the same inspect output (Node)
        run: |
          moon build --target js --release web
          mkdir -p /tmp/ws/cli /tmp/ws/json
          moon run cmd/main --target native -- build examples/hello/linuxpkg.json --out /tmp/ws/cli
          for f in /tmp/ws/cli/*; do
            moon run cmd/main --target native -- inspect "$f" --json > "/tmp/ws/json/$(basename "$f").json"
          done
          node tools/web_smoke.js _build/js/release/build/web/web.js examples/hello /tmp/ws/cli /tmp/ws/json

      - name: Enforce the core line-coverage floor
        run: python3 tools/check_core_coverage.py --minimum 90

      - name: Verify package artifact
        run: moon package --frozen

      - name: Reject generated or formatting drift
        run: git diff --exit-code

  oracle:
    name: oracle (official tools)
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Update package registry
        run: moon update

      - name: Install the official packaging tools
        run: sudo apt-get update && sudo apt-get install -y lintian rpm rpm2cpio cpio createrepo-c apt-utils xz-utils libarchive-tools zstd

      - name: Compare linuxpkg output with dpkg and friends
        run: tools/oracle/run.sh

  containers:
    name: containers (Debian, Ubuntu, Fedora, openEuler, Arch, Alpine)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Update package registry
        run: moon update

      - name: Install the packages in real distribution containers
        run: tools/oracle/containers.sh

  action:
    name: GitHub Action (self test)
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Build the binary the action will use
        run: |
          moon update
          moon build --target native --release cmd/main

      - name: Read the test-only signing key
        id: key
        run: |
          {
            echo "key<<LINUXPKG_KEY_EOF"
            cat testdata/sign/test-only-rsa2048.sec.asc
            echo "LINUXPKG_KEY_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Run the action
        id: pkg
        uses: ./
        with:
          config: examples/hello/linuxpkg.json
          format: all
          out: action-out
          sign-key: ${{ steps.key.outputs.key }}
          apk-key-name: test.rsa.pub
          binary-path: _build/native/release/build/cmd/main/main.exe

      - name: Check what the action produced
        run: |
          echo "${{ steps.pkg.outputs.files }}"
          test "$(echo "${{ steps.pkg.outputs.files }}" | wc -l)" -ge 5
          bin=_build/native/release/build/cmd/main/main.exe
          $bin verify action-out/hello-1.0.0-1.noarch.rpm --keyring testdata/sign/test-only-rsa2048.pub.asc
          $bin verify action-out/hello-1.0.0-1-any.pkg.tar.zst --keyring testdata/sign/test-only-rsa2048.pub.asc
          $bin verify action-out/hello-1.0.0-r1.apk --keyring testdata/sign/test-only-rsa2048.pub.asc
          $bin verify action-out/hello_1.0.0-1_all.deb
